<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>

body{
    margin:0;
    background:#1e1e1e;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#avatar{
    position:relative;
    width:712px;
    height:926px;
}

#base{
    position:absolute;
    left:0;
    top:0;
    width:100%;
}

/* AJUSTAREMOS ESTAS POSICIONES */
#ojoIzq{
    position:absolute;
    left:225px;
    top:285px;
    width:85px;
    transition:.08s;
}

#ojoDer{
    position:absolute;
    left:398px;
    top:285px;
    width:85px;
    transition:.08s;
}

</style>

</head>

<body>

<div id="avatar">

<img id="base" src="avatar/base.png">

<img id="ojoIzq" src="avatar/ojo_izq.png">

<img id="ojoDer" src="avatar/ojo_der.png">

</div>

<script>

const izq=document.getElementById("ojoIzq");
const der=document.getElementById("ojoDer");

function blink(){

    izq.style.transform="scaleY(0.05)";
    der.style.transform="scaleY(0.05)";

    setTimeout(()=>{

        izq.style.transform="scaleY(1)";
        der.style.transform="scaleY(1)";

    },130);

}

setInterval(blink,3000+Math.random()*2500);


// seguir el ratón

document.addEventListener("mousemove",e=>{

    let x=(e.clientX/window.innerWidth-.5)*6;
    let y=(e.clientY/window.innerHeight-.5)*4;

    izq.style.translate=x+"px "+y+"px";
    der.style.translate=x+"px "+y+"px";

});

</script>

</body>
</html>
