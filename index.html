<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Avatar Hablando</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes wave {
      0%, 100% { transform: scaleY(0.5); }
      50% { transform: scaleY(1); }
    }
    .paused .wave-bar {
      animation-play-state: paused !important;
      opacity: 0.3;
    }
    .paused #status-dot {
      background-color: #ef4444;
      animation: none;
    }
    .paused #status-text {
      color: #ef4444;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-slate-900 to-slate-800 min-h-screen flex flex-col items-center justify-center p-6">

  <div class="relative group">
    <div class="absolute -inset-1 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-3xl blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
    <div class="relative w-72 h-96 rounded-3xl overflow-hidden shadow-2xl border border-slate-700 bg-slate-900">
      <!-- Cambia estas rutas si tus imágenes tienen otro nombre -->
      <img id="avatar-img" src="img1.png" class="w-full h-full object-cover transition-opacity duration-75" alt="Avatar" />
    </div>
    <div class="absolute -bottom-4 left-1/2 transform -translate-x-1/2 flex items-center gap-2 bg-slate-900/90 backdrop-blur px-4 py-2 rounded-full border border-slate-700 shadow-lg">
      <div id="status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
      <span id="status-text" class="text-xs font-medium text-slate-300">Hablando...</span>
    </div>
  </div>

  <div class="mt-10 flex gap-3 flex-wrap justify-center">
    <button id="toggle-btn" onclick="toggleTalking()" class="px-5 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold rounded-xl shadow-lg transition-all active:scale-95 flex items-center gap-2">
      <svg id="pause-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <svg id="play-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span id="btn-text">Pausar</span>
    </button>
    <button onclick="setSpeed('slow')" id="speed-slow" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium rounded-xl transition-all active:scale-95 text-sm">Lento</button>
    <button onclick="setSpeed('normal')" id="speed-normal" class="px-4 py-2.5 bg-cyan-600 text-white font-medium rounded-xl transition-all active:scale-95 text-sm ring-2 ring-cyan-400">Normal</button>
    <button onclick="setSpeed('fast')" id="speed-fast" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium rounded-xl transition-all active:scale-95 text-sm">Rápido</button>
  </div>

  <div class="mt-8 flex items-end gap-1 h-10">
    <div class="wave-bar w-1 bg-cyan-500/60 rounded-full" style="height: 20%; animation: wave 0.8s ease-in-out infinite;"></div>
    <div class="wave-bar w-1 bg-cyan-500/60 rounded-full" style="height: 40%; animation: wave 0.9s ease-in-out infinite 0.1s;"></div>
    <div class="wave-bar w-1 bg-cyan-500/60 rounded-full" style="height: 60%; animation: wave 0.7s ease-in-out infinite 0.2s;"></div>
    <div class="wave-bar w-1 bg-cyan-500/60 rounded-full" style="height: 80%; animation: wave 0.85s ease-in-out infinite 0.15s;"></div>
    <div class="wave-bar w-1 bg-cyan-500/60 rounded-full" style="height: 100%; animation: wave 0.75s ease-in-out infinite 0.05s;"></div>
    <div class="wave-bar w-1 bg-cyan-500/60 rounded-full" style="height: 70%; animation: wave 0.95s ease-in-out infinite 0.25s;"></div>
    <div class="wave-bar w-1 bg-cyan-500/60 rounded-full" style="height: 50%; animation: wave 0.8s ease-in-out infinite 0.3s;"></div>
    <div class="wave-bar w-1 bg-cyan-500/60 rounded-full" style="height: 30%; animation: wave 0.9s ease-in-out infinite 0.2s;"></div>
    <div class="wave-bar w-1 bg-cyan-500/60 rounded-full" style="height: 60%; animation: wave 0.7s ease-in-out infinite 0.1s;"></div>
    <div class="wave-bar w-1 bg-cyan-500/60 rounded-full" style="height: 80%; animation: wave 0.85s ease-in-out infinite 0.35s;"></div>
    <div class="wave-bar w-1 bg-cyan-500/60 rounded-full" style="height: 40%; animation: wave 0.75s ease-in-out infinite 0.15s;"></div>
    <div class="wave-bar w-1 bg-cyan-500/60 rounded-full" style="height: 20%; animation: wave 0.9s ease-in-out infinite 0.05s;"></div>
  </div>

  <script>
    // Orden de las imágenes: hablando medio -> boca cerrada -> sonrisa/énfasis
    const images = [
      "Gemini_Generated_Image_lr1j2flr1j2flr1j.png",
      "Gemini_Generated_Image_89lp3989lp3989lp.png",
      "ChatGPT Image 17 de juny del 2026, 09_54_36.png"
    ];

    let currentIndex = 0;
    let isTalking = true;
    let intervalId = null;
    let speed = 200;
    const speeds = { slow: 400, normal: 200, fast: 100 };

    function startTalking() {
      if (intervalId) clearInterval(intervalId);
      intervalId = setInterval(() => {
        currentIndex = (currentIndex + 1) % images.length;
        document.getElementById('avatar-img').src = images[currentIndex];
      }, speed);
    }

    function stopTalking() {
      if (intervalId) { clearInterval(intervalId); intervalId = null; }
    }

    function toggleTalking() {
      isTalking = !isTalking;
      const btnText = document.getElementById('btn-text');
      const pauseIcon = document.getElementById('pause-icon');
      const playIcon = document.getElementById('play-icon');
      const container = document.querySelector('body');

      if (isTalking) {
        startTalking();
        btnText.textContent = 'Pausar';
        pauseIcon.classList.remove('hidden');
        playIcon.classList.add('hidden');
        container.classList.remove('paused');
        document.getElementById('status-text').textContent = 'Hablando...';
      } else {
        stopTalking();
        btnText.textContent = 'Reanudar';
        pauseIcon.classList.add('hidden');
        playIcon.classList.remove('hidden');
        container.classList.add('paused');
        document.getElementById('status-text').textContent = 'En pausa';
      }
    }

    function setSpeed(mode) {
      speed = speeds[mode];
      ['slow', 'normal', 'fast'].forEach(m => {
        const btn = document.getElementById('speed-' + m);
        if (m === mode) {
          btn.className = 'px-4 py-2.5 bg-cyan-600 text-white font-medium rounded-xl transition-all active:scale-95 text-sm ring-2 ring-cyan-400';
        } else {
          btn.className = 'px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium rounded-xl transition-all active:scale-95 text-sm';
        }
      });
      if (isTalking) startTalking();
    }

    startTalking();
  </script>
</body>
</html>
