<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#1f1f1f;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;

}

#avatar{

    position:relative;
    width:712px;
    height:926px;

    animation:respirar 4s ease-in-out infinite;

}

#base{

    position:absolute;
    width:100%;
    left:0;
    top:0;

}

#ojoIzq{

    position:absolute;

    left:226px;
    top:286px;

    width:84px;

    transform-origin:center;

    transition:.08s;

}

#ojoDer{

    position:absolute;

    left:401px;
    top:286px;

    width:84px;

    transform-origin:center;

    transition:.08s;

}

@keyframes respirar{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(3px);
}

100%{
transform:translateY(0px);
}

}

</style>

</head>

<body>

<div id="avatar">

<img id="base" src="base.png">

<img id="ojoIzq" src="ojo_izq.png">

<img id="ojoDer" src="ojo_der.png">

</div>

<script>

const ojoI=document.getElementById("ojoIzq");
const ojoD=document.getElementById("ojoDer");

function parpadear(){

    ojoI.style.transform="scaleY(0.05)";
    ojoD.style.transform="scaleY(0.05)";

    setTimeout(()=>{

        ojoI.style.transform="scaleY(1)";
        ojoD.style.transform="scaleY(1)";

    },120);

}

function siguienteParpadeo(){

    parpadear();

    setTimeout(
        siguienteParpadeo,
        2500 + Math.random()*2500
    );

}

setTimeout(siguienteParpadeo,1500);

document.addEventListener("mousemove",e=>{

    let x=(e.clientX/window.innerWidth-0.5)*6;
    let y=(e.clientY/window.innerHeight-0.5)*4;

    ojoI.style.translate=x+"px "+y+"px";
    ojoD.style.translate=x+"px "+y+"px";

});

</script>

</body>

</html>
