<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Avatar IA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#202020;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

#avatar{

    position:relative;

    width:712px;
    height:926px;

    animation:respirar 4s ease-in-out infinite;

}

#avatar img{

    position:absolute;
    left:0;
    top:0;

    width:100%;
    height:100%;

}

@keyframes respirar{

0%{
transform:translateY(0px) rotate(0deg);
}

50%{
transform:translateY(4px) rotate(.25deg);
}

100%{
transform:translateY(0px) rotate(0deg);
}

}

</style>

</head>

<body>

<div id="avatar">

<img src="base.png">

<img id="boca0" src="boca_0.png">
<img id="boca1" src="boca_1.png" style="opacity:0">
<img id="boca2" src="boca_2.png" style="opacity:0">

</div>

<script>

const b0=document.getElementById("boca0");
const b1=document.getElementById("boca1");
const b2=document.getElementById("boca2");

const estados=[
    [1,0,0],
    [0,1,0],
    [0,0,1],
    [0,1,0]
];

let i=0;

setInterval(()=>{

    b0.style.opacity=estados[i][0];
    b1.style.opacity=estados[i][1];
    b2.style.opacity=estados[i][2];

    i++;

    if(i>=estados.length)
        i=0;

},120);

</script>

</body>
</html>
