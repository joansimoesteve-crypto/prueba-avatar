<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Avatar IA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#1e1e1e;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;

    overflow:hidden;

}

#avatar{

    position:relative;

    width:712px;
    height:926px;

    animation:respirar 5s ease-in-out infinite;

}

#avatar img{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    user-select:none;
    pointer-events:none;

}

#ojoIzq,
#ojoDer{

    transform-origin:center center;

}

@keyframes respirar{

0%{

    transform:
    translateY(0px)
    rotate(0deg);

}

50%{

    transform:
    translateY(4px)
    rotate(.3deg);

}

100%{

    transform:
    translateY(0px)
    rotate(0deg);

}

}

</style>

</head>

<body>

<div id="avatar">

    <img id="base" src="base.png">

    <img id="ojoIzq" src="ojo_izq.png">

    <img id="ojoDer" src="ojo_der.png">

</div>

<script>

const ojoI=document.getElementById("ojoIzq");
const ojoD=document.getElementById("ojoDer");

function blink(){

    ojoI.style.transform="scaleY(0.08)";
    ojoD.style.transform="scaleY(0.08)";

    setTimeout(()=>{

        ojoI.style.transform="scaleY(1)";
        ojoD.style.transform="scaleY(1)";

    },120);

}

(function loop(){

    blink();

    setTimeout(loop,2500+Math.random()*2500);

})();

document.addEventListener("mousemove",(e)=>{

    const x=(e.clientX/window.innerWidth-.5)*2;
    const y=(e.clientY/window.innerHeight-.5)*1;

    ojoI.style.translate=`${x}px ${y}px`;
    ojoD.style.translate=`${x}px ${y}px`;

});

</script>

</body>
</html>
