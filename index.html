<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#171717;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

overflow:hidden;

}

#scene{

perspective:1200px;

}

#avatar{

width:700px;

transition:
transform .08s linear;

transform-style:preserve-3d;

filter:drop-shadow(0 25px 40px rgba(0,0,0,.45));

}

#avatar img{

width:100%;
display:block;
user-select:none;
pointer-events:none;

}

</style>

</head>

<body>

<div id="scene">

<div id="avatar">

<img src="base.png">

</div>

</div>

<script>

const avatar=document.getElementById("avatar");

let mx=0;
let my=0;

document.addEventListener("mousemove",e=>{

mx=(e.clientX/window.innerWidth-.5);
my=(e.clientY/window.innerHeight-.5);

});

let t=0;

function loop(){

t+=0.03;

const breathe=Math.sin(t)*4;

const rotateX=my*8;

const rotateY=-mx*12;

const rotateZ=Math.sin(t*.5)*1.2;

const scale=1+Math.sin(t)*0.005;

avatar.style.transform=`
translateY(${breathe}px)
rotateX(${rotateX}deg)
rotateY(${rotateY}deg)
rotateZ(${rotateZ}deg)
scale(${scale})
`;

requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
